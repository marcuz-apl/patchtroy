services:
  patchtroy:
    build:
      context: .
      dockerfile: Dockerfile
    image: marcuszou/patchtroy:latest
    container_name: patchtroy-api
    restart: unless-stopped
    ports:
      - "4013:4013"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4013/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
