site_name: Playtrafi
site_description: Undetected stealth web scraper & clean Markdown extractor for LLMs.
site_url: https://marcuz-apl.github.io/playtrafi
repo_url: https://github.com/marcuz-apl/playtrafi
repo_name: marcuz-apl/playtrafi
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Features:
      - Stealth Architecture: stealth-architecture.md
      - Browser Context Pool: context-pool.md
      - Screenshots & PDFs: media-capture.md
      - Proxy Rotation Manager: proxy-rotation.md
      - LLM Chunking & Tokenizer: llm-chunking.md
      - REST API Microservice: rest-api.md
  - Benchmarks: benchmarks.md
  - Rebranding Guide: rebranding-guide.md
