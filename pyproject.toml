[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchtroy"
version = "0.1.0"
description = "Undetected stealth web scraper & markdown extractor for LLMs, pairing Patchright with Trafilatura."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Marcus Zou", email = "marcus.zou@icloud.com" }
]
keywords = [
    "crawler",
    "scraper",
    "stealth",
    "patchright",
    "playwright",
    "trafilatura",
    "markdown",
    "llm",
    "rag",
    "anti-bot"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "patchright>=1.49.0",
    "trafilatura>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
patchtroy = "patchtroy.cli:main"

[project.urls]
Homepage = "https://github.com/marcuz-apl/patchtroy"
Repository = "https://github.com/marcuz-apl/patchtroy"
Issues = "https://github.com/marcuz-apl/patchtroy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/patchtroy"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
